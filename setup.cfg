[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    outputs,
    models,
    data,
    logs,
    .github
ignore =
    E203,   # whitespace before ':'
    W503,   # line break before binary operator
    E501    # line too long (covered by max-line-length)
per-file-ignores =
    tests/*:E501

[isort]
profile = black
line_length = 120
skip_glob = data/*, outputs/*, models/*, logs/*
