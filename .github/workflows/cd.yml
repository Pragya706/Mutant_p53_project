name: CD – Train & Release

on:
  # Trigger CD manually from GitHub UI
  workflow_dispatch:
    inputs:
      component:
        description: "Which component to train"
        required: true
        default: "all"
        type: choice
        options: [ "all", "ensemble", "fl", "gnn" ]
      rebuild:
        description: "Force rebuild cached features"
        required: false
        default: "false"
        type: choice
        options: [ "true", "false" ]

  # OR trigger automatically when a new tag is pushed (e.g. v1.0.0)
  push:
    tags: [ "v*.*.*" ]

env:
  PYTHON_VERSION: "3.11"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  #  Train full pipeline (real data expected in GitHub Secrets or LFS)
  # ────────────────────────────────────────────────────────────────────────────
  train:
    name: Train Pipeline
    runs-on: ubuntu-latest      # swap to self-hosted GPU runner for real training

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            numpy pandas scipy scikit-learn \
            xgboost lightgbm \
            torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu \
            torch-geometric \
            networkx biopython \
            matplotlib seaborn tqdm

      # ── Download dataset from GitHub Releases / S3 / DVC ─────────────────
      # Option A: data stored in GitHub Releases as assets
      - name: Download datasets
        run: |
          mkdir -p data/raw/tp53 data/raw/string data/raw/biogrid
          # Replace these with your actual download commands:
          # curl -L "${{ secrets.TP53_DATA_URL }}"    -o data/raw/tp53/tp53_mutations.csv
          # curl -L "${{ secrets.STRING_LINKS_URL }}" -o data/raw/string/string_links_human_v12.txt
          # curl -L "${{ secrets.STRING_INFO_URL }}"  -o data/raw/string/9606_protein_info_v12_0.txt
          # curl -L "${{ secrets.BIOGRID_URL }}"      -o data/raw/biogrid/biogrid_all_4.4.243.tab3.txt
          echo "Dataset download step – configure secrets above"

      - name: Run pipeline
        run: |
          REBUILD_FLAG=""
          if [ "${{ github.event.inputs.rebuild }}" = "true" ]; then
            REBUILD_FLAG="--rebuild"
          fi
          python main.py \
            --component "${{ github.event.inputs.component || 'all' }}" \
            $REBUILD_FLAG

      # ── Save model artefacts ─────────────────────────────────────────────
      - name: Upload model artefacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-models-${{ github.sha }}
          path: |
            models/
            outputs/*.png
            logs/pipeline.log
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  #  Create GitHub Release with model artefacts (only on tag push)
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: train
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download trained artefacts
        uses: actions/download-artifact@v4
        with:
          name: trained-models-${{ github.sha }}
          path: release/

      - name: Create release archive
        run: |
          cd release
          tar -czf ../p53_models_${{ github.ref_name }}.tar.gz .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: p53_models_${{ github.ref_name }}.tar.gz
          body: |
            ## p53 Reactivation Model – ${{ github.ref_name }}

            ### Components trained
            - GAT (Graph Attention Network) – node-level pathogenicity
            - Stacking Ensemble (XGB + LGBM + RF + ET)
            - Federated Learning (FedProx, cancer-type partitioned)

            ### How to use
            ```bash
            tar -xzf p53_models_${{ github.ref_name }}.tar.gz
            python main.py --skip-gnn   # inference using saved models
            ```
