name: CI – Lint & Tests

on:
  push:
    branches: [ "main", "dev", "feature/**" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  PYTHON_VERSION: "3.11"        # pin to 3.11; torch-geometric wheels stable here
  PYTHONIOENCODING: "utf-8"     # fix Windows Unicode issues

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  #  1. Code quality: flake8 + isort
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8 + isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install linters
        run: pip install flake8 isort

      - name: flake8
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=.git,__pycache__,outputs,models,data,logs \
            --ignore=E203,W503

      - name: isort check
        run: isort --check-only --diff .

  # ────────────────────────────────────────────────────────────────────────────
  #  2. Unit tests (CPU-only, small synthetic data – no real dataset needed)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            numpy pandas scipy scikit-learn \
            xgboost lightgbm \
            torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu \
            torch-geometric \
            networkx biopython \
            matplotlib seaborn tqdm \
            pytest pytest-cov

      - name: Run unit tests
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────────────────────
  #  3. Smoke test: run full pipeline with synthetic data
  # ────────────────────────────────────────────────────────────────────────────
  smoke:
    name: Smoke Test (synthetic data)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            numpy pandas scipy scikit-learn \
            xgboost lightgbm \
            torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu \
            torch-geometric \
            networkx biopython \
            matplotlib seaborn tqdm

      - name: Generate synthetic dataset + run pipeline
        run: python tests/generate_synthetic_data.py && python main.py --skip-gnn

      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: outputs/
          retention-days: 7
